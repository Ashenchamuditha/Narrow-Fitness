services:
  backend:
    build: .
    command: npm run server
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules # MAGIC: This creates a private Linux-only folder
    restart: always

  frontend:
    build: .
    command: npm run frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules # MAGIC: This creates a private Linux-only folder
    restart: always