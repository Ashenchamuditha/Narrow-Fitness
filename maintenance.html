<!-- public/maintenance.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update | Narrow Fitness</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .container { padding: 20px; }
        h1 { font-style: italic; text-transform: uppercase; font-size: 3rem; letter-spacing: -2px; margin: 0; }
        span { color: #f97316; } /* Orange */
        p { color: #666; text-transform: uppercase; font-size: 12px; letter-spacing: 4px; margin-top: 10px; }
        .loader { border: 3px solid #111; border-top: 3px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Narrow <span>Fitness</span></h1>
        <p>System Optimization in Progress</p>
        <div class="loader"></div>
        <p style="font-size: 10px; opacity: 0.5;">The Vanguard is upgrading. We'll be back shortly.</p>
    </div>
</body>
</html>
